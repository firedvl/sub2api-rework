name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  updater-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Production-like updater lifecycle under systemd
        working-directory: backend
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/sub2api-rework-updater ./cmd/updater
          CGO_ENABLED=0 go test -c -tags=staging \
            -o /tmp/sub2api-rework-updater-qualification ./internal/updater
          sudo groupadd --force --system sub2api-updater
          test "$(getent group sub2api-updater | cut -d: -f3)" -ne 0
          sudo install -o root -g root -m 0755 \
            /tmp/sub2api-rework-updater /usr/local/sbin/sub2api-rework-updater
          sudo install -D -o root -g root -m 0755 \
            /tmp/sub2api-rework-updater-qualification \
            /usr/local/libexec/sub2api-rework-updater-qualification
          sudo install -D -o root -g root -m 0644 \
            ../deploy/docker-compose.yml \
            /usr/local/share/sub2api-rework-qualification/docker-compose.yml
          sudo install -D -o root -g root -m 0600 \
            ../deploy/updater/updater.example.json /etc/sub2api-rework/updater.json
          sudo install -D -o root -g root -m 0644 \
            ../deploy/updater/sub2api-rework-updater.service \
            /etc/systemd/system/sub2api-rework-updater.service
          sudo install -d -o root -g root -m 0755 \
            /etc/systemd/system/sub2api-rework-updater.service.d
          sudo install -d -o root -g root -m 0755 /opt/sub2api
          sudo /usr/local/sbin/sub2api-rework-updater \
            --config /etc/sub2api-rework/updater.json \
            --print-systemd-drop-in \
            | sudo tee \
              /etc/systemd/system/sub2api-rework-updater.service.d/10-deployment.conf \
              >/dev/null
          printf '%s\n' \
            '[Service]' \
            'Type=oneshot' \
            'RemainAfterExit=yes' \
            'Environment=SUB2API_STAGING_COMPOSE=/usr/local/share/sub2api-rework-qualification/docker-compose.yml' \
            'ExecStart=' \
            'ExecStart=/usr/local/libexec/sub2api-rework-updater-qualification -test.run=^TestProductionBootstrapPreservesUpdaterAccess$ -test.v -test.count=1 -test.timeout=20m' \
            'Restart=no' \
            'TimeoutStartSec=25min' \
            | sudo tee \
              /etc/systemd/system/sub2api-rework-updater.service.d/20-qualification.conf \
              >/dev/null
          sudo systemd-analyze verify \
            /etc/systemd/system/sub2api-rework-updater.service
          sudo systemctl daemon-reload
          trap 'sudo systemctl stop sub2api-rework-updater.service >/dev/null 2>&1 || true' EXIT
          if ! sudo systemctl start sub2api-rework-updater.service; then
            sudo systemctl status --no-pager sub2api-rework-updater.service || true
            sudo journalctl --no-pager -u sub2api-rework-updater.service
            exit 1
          fi
          sudo journalctl --no-pager -u sub2api-rework-updater.service
          runtime_before="$(stat -Lc '%d:%i' /run/sub2api-rework-updater)"
          printf '%s\n' \
            '[Service]' \
            'Type=oneshot' \
            'RemainAfterExit=yes' \
            'ExecStart=' \
            'ExecStart=/usr/bin/test -d /run/sub2api-rework-updater' \
            'Restart=no' \
            | sudo tee \
              /etc/systemd/system/sub2api-rework-updater.service.d/20-qualification.conf \
              >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart sub2api-rework-updater.service
          runtime_after="$(stat -Lc '%d:%i' /run/sub2api-rework-updater)"
          test "$runtime_after" = "$runtime_before"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Operator console browser tests
        working-directory: frontend
        run: pnpm test:e2e

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend
