name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  updater-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Production-like updater lifecycle
        working-directory: backend
        run: |
          docker_gid="$(stat -c '%g' /var/run/docker.sock)"
          test "$docker_gid" -ne 0
          sudo -n setpriv \
            --reuid=0 \
            --regid="$docker_gid" \
            --clear-groups \
            env \
            PATH="$PATH" \
            HOME=/root \
            TMPDIR=/tmp \
            go test -tags=staging ./internal/updater \
              -run '^TestProductionBootstrapPreservesUpdaterAccess$' \
              -count=1 -timeout=20m
      - name: Verify updater systemd sandbox
        working-directory: backend
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/sub2api-rework-updater ./cmd/updater
          sudo install -o root -g root -m 0755 \
            /tmp/sub2api-rework-updater /usr/local/sbin/sub2api-rework-updater
          sudo install -D -o root -g root -m 0600 \
            ../deploy/updater/updater.example.json /etc/sub2api-rework/updater.json
          sudo install -D -o root -g root -m 0644 \
            ../deploy/updater/sub2api-rework-updater.service \
            /etc/systemd/system/sub2api-rework-updater.service
          sudo install -d -o root -g root -m 0755 \
            /etc/systemd/system/sub2api-rework-updater.service.d
          sudo /usr/local/sbin/sub2api-rework-updater \
            --config /etc/sub2api-rework/updater.json \
            --print-systemd-drop-in \
            | sudo tee \
              /etc/systemd/system/sub2api-rework-updater.service.d/10-deployment.conf \
              >/dev/null
          sudo systemd-analyze verify \
            /etc/systemd/system/sub2api-rework-updater.service

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Operator console browser tests
        working-directory: frontend
        run: pnpm test:e2e

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend
