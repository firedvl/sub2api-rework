name: Release

on:
  push:
    tags:
      - 'v*-rework.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Qualified rework tag (e.g., v0.1.184-rework.1)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false

# 环境变量：合并 workflow_dispatch 输入和 repository variable
# tag push 触发时读取 vars.SIMPLE_RELEASE，workflow_dispatch 时使用输入参数
env:
  SIMPLE_RELEASE: ${{ github.event.inputs.simple_release == 'true' || vars.SIMPLE_RELEASE == 'true' }}

permissions:
  contents: write
  packages: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    outputs:
      qualified_sha: ${{ steps.release_identity.outputs.qualified_sha }}
      release_tag: ${{ steps.release_identity.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate committed release metadata
        id: release_identity
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rework\.(0|[1-9][0-9]*)$'
          METADATA=backend/internal/releaseinfo/metadata.json
          VERSION=$(jq -er '.rework_version' "$METADATA")
          test "$RELEASE_TAG" = "v${VERSION}"
          test "$(jq -er '.rework_repository' "$METADATA")" = "${GITHUB_REPOSITORY}"
          test "$(jq -er '.artifact_repository' "$METADATA")" = "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sub2api-rework"
          test "$(jq -er '.default_policy' "$METADATA")" = "manual"
          QUALIFIED_SHA=$(git rev-parse --verify 'HEAD^{commit}')
          test "$(git rev-parse --verify "${RELEASE_TAG}^{commit}")" = "$QUALIFIED_SHA"
          printf 'qualified_sha=%s\n' "$QUALIFIED_SHA" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Qualify updater and release contracts
        working-directory: backend
        run: go test -tags=unit ./internal/releaseinfo ./internal/updatecontract ./internal/updater ./internal/updaterclient

  build-frontend:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.qualify.outputs.qualified_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    needs: [qualify, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.qualify.outputs.qualified_sha }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'

      # Docker setup for GoReleaser
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reassert qualified tag identity before publication
        env:
          RELEASE_TAG: ${{ needs.qualify.outputs.release_tag }}
          QUALIFIED_SHA: ${{ needs.qualify.outputs.qualified_sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse --verify "${RELEASE_TAG}^{commit}")" = "$QUALIFIED_SHA"

      - name: Get tag message
        id: tag_message
        env:
          RELEASE_TAG: ${{ needs.qualify.outputs.release_tag }}
        run: |
          set -eu
          echo "Processing tag: $RELEASE_TAG"

          # 获取完整的 tag message（跳过第一行标题）
          TAG_MESSAGE=$(git tag -l --format='%(contents:body)' "$RELEASE_TAG")

          # 调试输出
          echo "Tag message length: ${#TAG_MESSAGE}"
          echo "Tag message preview:"
          echo "$TAG_MESSAGE" | head -10

          # 使用 EOF 分隔符处理多行内容
          {
            echo "message<<EOF"
            echo "$TAG_MESSAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set lowercase owner for GHCR
        id: lowercase
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=validate ${{ env.SIMPLE_RELEASE == 'true' && '--config=.goreleaser.simple.yaml' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}

      - name: Create and validate immutable release manifest
        env:
          RELEASE_TAG: ${{ needs.qualify.outputs.release_tag }}
          QUALIFIED_SHA: ${{ needs.qualify.outputs.qualified_sha }}
          EXPECTED_SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test "$(git rev-parse --verify "${RELEASE_TAG}^{commit}")" = "$QUALIFIED_SHA"
          METADATA=backend/internal/releaseinfo/metadata.json
          VERSION=$(jq -er '.rework_version' "$METADATA")
          UPSTREAM=$(jq -er '.upstream_baseline' "$METADATA")
          UPSTREAM_SHA=$(jq -er '.upstream_baseline_sha | select(test("^[0-9a-f]{40}$"))' "$METADATA")
          IMAGE=$(jq -er '.artifact_repository' "$METADATA")
          MIGRATION_MIN=$(jq -er '.migration_min' "$METADATA")
          MIGRATION_MAX=$(jq -er '.migration_max' "$METADATA")
          MINIMUM_UPDATER=$(jq -er '.minimum_updater_version' "$METADATA")
          PLATFORMS='linux/amd64'
          if [ "$SIMPLE_RELEASE" != 'true' ]; then
            PLATFORMS="$PLATFORMS linux/arm64"
          fi
          for PLATFORM in $PLATFORMS; do
            docker pull --quiet --platform "$PLATFORM" "${IMAGE}:${VERSION}"
            LABELS=$(docker image inspect "${IMAGE}:${VERSION}" --format '{{json .Config.Labels}}')
            test "$(printf '%s' "$LABELS" | jq -er '.["org.opencontainers.image.source"]')" = "$EXPECTED_SOURCE"
            test "$(printf '%s' "$LABELS" | jq -er '.["org.opencontainers.image.revision"]')" = "$QUALIFIED_SHA"
          done
          MANIFEST_JSON=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}')
          DIGEST=$(printf '%s' "$MANIFEST_JSON" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
          GIT_SHA=$QUALIFIED_SHA
          RELEASE_DATE=$(git show -s --format=%cI HEAD)
          REWORK_NOTES=$(git tag -l --format='%(contents:subject)' "$RELEASE_TAG")
          REWORK_NOTES=${REWORK_NOTES:0:4000}

          jq -n \
            --arg rework_version "$VERSION" \
            --arg upstream_version "$UPSTREAM" \
            --arg upstream_baseline_sha "$UPSTREAM_SHA" \
            --arg git_sha "$GIT_SHA" \
            --arg image "${IMAGE}:${VERSION}" \
            --arg image_digest "$DIGEST" \
            --arg release_date "$RELEASE_DATE" \
            --arg minimum_updater_version "$MINIMUM_UPDATER" \
            --arg rework_notes "$REWORK_NOTES" \
            --argjson migration_min "$MIGRATION_MIN" \
            --argjson migration_max "$MIGRATION_MAX" \
            '{
              schema_version: 1,
              rework_version: $rework_version,
              upstream_version: $upstream_version,
              git_sha: $git_sha,
              image: $image,
              image_digest: $image_digest,
              migration_min: $migration_min,
              migration_max: $migration_max,
              release_date: $release_date,
              compatibility: "approved",
              minimum_updater_version: $minimum_updater_version,
              release_notes: {
                upstream: ("Qualified against upstream " + $upstream_version + " (upstream_baseline_sha=" + $upstream_baseline_sha + ")."),
                rework: $rework_notes,
                compatibility: "Approved after release qualification checks.",
                migrations: ("Supports schema migrations " + ($migration_min | tostring) + " through " + ($migration_max | tostring) + "."),
                rollback: "Automatic rollback restores the pre-update backup; manual rollback is blocked after migrations advance."
              }
            }' > release-manifest.json

          (cd backend && SUB2API_RELEASE_MANIFEST="$GITHUB_WORKSPACE/release-manifest.json" \
            go test -tags=unit -run TestReleaseManifestFromEnvironment ./internal/updatecontract)

      - name: Upload release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.qualify.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-manifest.json --clobber

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@v5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_TAG: ${{ needs.qualify.outputs.release_tag }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          TAG_NAME=$RELEASE_TAG
          VERSION=${TAG_NAME#v}
          REPO=$GITHUB_REPOSITORY
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          # shellcheck disable=SC2001
          TAG_MESSAGE=$(echo "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKER_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/sub2api)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"
