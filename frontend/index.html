<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The operator marker prevents the embedded server from restoring its legacy title. -->
    <title data-operator-brand>Gateway</title>
    <script>
      // Apply the saved theme and accent before first paint.
      (function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('theme')
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) root.classList.add('dark')
          var accent = localStorage.getItem('accent')
          if (accent && accent !== 'iris') root.dataset.accent = accent
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
